<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Enlight the Bully</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <!-- home-screen app -->
        <meta name="robots" content="noindex, nofollow" />
        <meta name="theme-color" content="#050a06" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="ETB" />
        <link rel="manifest" href="pwa/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="pwa/icon-180.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="pwa/icon-192.png" />
        <script>
            // Registered from the passphrase shell so it installs before unlock.
            // The worker is network-first for the page: it never serves stale
            // stock, it only keeps a copy so the app still opens with no signal.
            if ("serviceWorker" in navigator && location.protocol === "https:") {
                window.addEventListener("load", function () {
                    navigator.serviceWorker.register("sw.js").catch(function () {});
                });
            }
        </script>

        <style>
            :root {
                --bg: #050a06;
                --panel: #0a130c;
                --line: #15321b;
                --ink: #c9f5cd;
                --dim: #4f8557;
                --accent: #2bff6a;
                --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
                --serif: Georgia, "Times New Roman", serif;
            }

            .staticrypt-hr {
                margin: 22px 0;
                border: 0;
                border-top: 1px solid var(--line);
            }

            .staticrypt-page {
                width: 340px;
                max-width: 92vw;
                padding: 14vh 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: var(--panel);
                border: 1px solid var(--line);
                margin: 0 auto 100px;
                padding: 40px 36px 34px;
                text-align: center;
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-size: 14px;
                font-family: var(--mono);
                color: var(--ink);
                outline: 0;
                padding: 14px 44px 14px 14px;
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: var(--bg);
                border: 1px solid var(--line);
                width: 100%;
                margin: 0 0 16px;
                box-sizing: border-box;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--accent);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 45%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
                filter: invert(0.9);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 0.12em;
                outline: 0;
                background: var(--accent);
                width: 100%;
                border: 0;
                padding: 14px;
                color: #050a06;
                font-size: 13px;
                font-family: var(--mono);
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(108%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: var(--bg);
                font-family: var(--mono);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-family: var(--serif);
                font-weight: 400;
                font-size: 1.5em;
                letter-spacing: 0.04em;
                color: var(--ink);
            }

            .staticrypt-instructions p:not(.staticrypt-title) {
                color: var(--dim);
                font-size: 12px;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1.2em;
                color: var(--dim);
                font-size: 12px;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.2);
                margin-right: 1em;
                accent-color: var(--accent);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--line);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>
